# Contrôles automatiques à chaque push (audit sécurité 3.4, 29/10/2026)
# secrets : gitleaks sur les commits poussés ; dépendances : échec si alerte élevée ou critique ;
# code : Semgrep (XSS…), rapport sans blocage pour commencer ; types : tsc (le build Vercel vérifie aussi les types, M7).
name: Sécurité

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # yarn 1 : le code de sortie additionne les gravités trouvées (8 = élevée, 16 = critique), --level ne le change pas
      - name: yarn audit (élevée ou critique = échec)
        run: |
          set +e
          yarn audit --groups dependencies --level high
          code=$?
          set -e
          if [ $((code & 24)) -ne 0 ]; then echo "Alerte élevée ou critique dans les dépendances."; exit 1; fi

  code:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep
        continue-on-error: true
        run: semgrep scan --config p/react --config p/nextjs --config p/javascript --config p/secrets --metrics=off --error

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Typage
        run: npx tsc --noEmit -p tsconfig.json
